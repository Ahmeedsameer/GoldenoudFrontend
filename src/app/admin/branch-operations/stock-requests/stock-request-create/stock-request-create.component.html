<app-loading [loading]="loading"></app-loading>

<div class="p-4 md:p-6 max-w-4xl mx-auto" dir="rtl">

  <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-1">طلب مخزون جديد</h1>
  <p class="text-sm text-gray-500 dark:text-gray-400 mb-5">من المخزن الرئيسي إلى فرعك — بانتظار موافقة الإدارة قبل أي شحن.</p>

  @if (errorMsg) {
    <div class="mb-5"><app-alert variant="error" [message]="errorMsg"></app-alert></div>
  }

  <div class="bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 p-5 space-y-5">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">المصدر</label>
        <div class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 dark:border-white/10 bg-gray-50 dark:bg-white/5 text-gray-700 dark:text-gray-300">
          المخزن الرئيسي
        </div>
      </div>
      @if (isAdmin) {
        <div>
          <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">الفرع المطلوب له <span class="text-error-500">*</span></label>
          <select [(ngModel)]="destinationShopId" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-white/10 bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
            <option [ngValue]="null">اختر الفرع...</option>
            @for (b of branches; track b.id) { <option [ngValue]="b.id">{{ b.name }}</option> }
          </select>
        </div>
      }
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">الأولوية</label>
        <select [(ngModel)]="priority" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-white/10 bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
          <option value="low">منخفضة</option>
          <option value="normal">عادية</option>
          <option value="high">مرتفعة</option>
          <option value="urgent">عاجلة</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">تاريخ الطلب</label>
        <app-date-picker id="sr-create-date" [value]="requestedDate" (valueChange)="requestedDate = $event"></app-date-picker>
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-600 dark:text-gray-400 mb-1">ملاحظات</label>
      <textarea [(ngModel)]="notes" rows="2" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 dark:border-white/10 bg-white dark:bg-gray-800 text-gray-900 dark:text-white"></textarea>
    </div>

    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="text-sm font-semibold text-gray-700 dark:text-gray-300">الأصناف المطلوبة</label>
        <button type="button" (click)="addItemRow()" class="text-xs font-medium text-brand-600 dark:text-brand-400">+ إضافة صنف</button>
      </div>

      <div class="space-y-2">
        @for (item of items; track $index) {
          <div class="grid grid-cols-12 gap-2 items-center">
            <select [(ngModel)]="item.product_id"
              class="col-span-8 px-2 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-white/10 bg-white dark:bg-gray-800 text-gray-900 dark:text-white">
              <option [ngValue]="null">اختر المنتج</option>
              @for (p of transferableProducts; track p.id) { <option [ngValue]="p.id">{{ p.name }} ({{ p.sku }})</option> }
            </select>
            <input type="number" min="0" step="0.001" [(ngModel)]="item.requested_quantity" placeholder="الكمية"
              class="col-span-3 px-2 py-1.5 text-sm rounded-lg border border-gray-300 dark:border-white/10 bg-white dark:bg-gray-800 text-gray-900 dark:text-white"/>
            <button type="button" (click)="removeItemRow($index)" class="col-span-1 text-error-500 text-sm">✕</button>
          </div>
        }
      </div>
    </div>

    <div class="flex items-center gap-2 pt-2">
      <button type="button" (click)="save()" [disabled]="saving"
        class="px-4 py-2 rounded-xl text-sm font-semibold bg-brand-500 hover:bg-brand-600 text-white transition-colors disabled:opacity-50">
        إرسال طلب المخزون
      </button>
    </div>

  </div>
</div>
