<div class="p-4 md:p-6 space-y-6" dir="rtl">

  <div class="flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h1 class="text-2xl font-bold text-gray-900">لوحة المخزون</h1>
      <p class="text-sm text-gray-500 mt-0.5">نظرة عامة على المخزون عبر كل الفروع</p>
    </div>
    <div class="flex items-center gap-3">
      <app-report-toolbar exportPath="/admin/stock-intelligence/export" [params]="{}" fileName="تقرير-المخزون" (refresh)="load()"></app-report-toolbar>
      <a routerLink="/dashboard/stock-intelligence" class="text-sm font-medium text-brand-600 hover:text-brand-700">
        ذكاء المخزون التفصيلي ←
      </a>
    </div>
  </div>

  @if (loading) { <app-loading /> }

  @if (!loading && data) {

    <!-- Products by type -->
    <div>
      <h2 class="text-sm font-semibold text-gray-700 mb-3">المنتجات حسب النوع</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <app-report-kpi-card title="خامات" [value]="data.raw_material_count" icon="🛢️" color="neutral"></app-report-kpi-card>
        <app-report-kpi-card title="مستلزمات تعبئة" [value]="data.packaging_count" icon="🧴" color="neutral"></app-report-kpi-card>
        <app-report-kpi-card title="منتجات جاهزة" [value]="data.ready_product_count" icon="📦" color="neutral"></app-report-kpi-card>
        <app-report-kpi-card title="عطور مركّبة (بدون مخزون)" [value]="data.compound_count" icon="🧪" color="neutral"></app-report-kpi-card>
      </div>
    </div>

    <!-- KPI cards -->
    <div>
      <h2 class="text-sm font-semibold text-gray-700 mb-3">حالة المخزون</h2>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <app-report-kpi-card title="إجمالي قيمة المخزون" [value]="data.total_inventory_value | number:'1.0-0'" suffix="ج.م" icon="💰" color="brand"></app-report-kpi-card>
        <app-report-kpi-card title="مخزون منخفض" [value]="data.low_stock_count" [subtitle]="'حد التنبيه: ' + data.threshold" icon="⚠️" color="warning"></app-report-kpi-card>
        <app-report-kpi-card title="نفد من المخزون" [value]="data.out_of_stock_count" icon="🚫" color="error"></app-report-kpi-card>
        <app-report-kpi-card title="قريب من انتهاء الصلاحية" value="—" subtitle="قريباً" icon="⏳" color="neutral"></app-report-kpi-card>
      </div>
    </div>

  }

</div>
