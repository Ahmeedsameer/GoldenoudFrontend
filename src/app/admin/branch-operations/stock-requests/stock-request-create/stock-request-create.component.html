<app-loading [loading]="loading"></app-loading>

<div class="p-4 md:p-6 max-w-4xl mx-auto" dir="rtl">

  <div class="crud-page-head">
    <div>
      <h1 class="page-title">طلب مخزون جديد</h1>
      <p class="page-subtitle">من المخزن الرئيسي إلى فرعك — بانتظار موافقة الإدارة قبل أي شحن.</p>
    </div>
  </div>

  @if (errorMsg) {
    <div class="mb-5"><app-alert variant="error" [message]="errorMsg"></app-alert></div>
  }

  <div class="bg-white rounded-2xl border border-gray-200 p-5 space-y-5">

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">المصدر</label>
        <div class="w-full px-3 py-2 text-sm rounded-lg border border-gray-200 bg-gray-50 text-gray-700">
          المخزن الرئيسي
        </div>
      </div>
      @if (isAdmin) {
        <div>
          <label class="block text-xs font-medium text-gray-600 mb-1">الفرع المطلوب له <span class="text-error-500">*</span></label>
          <select [(ngModel)]="destinationShopId" class="w-full h-10 px-3 py-2 text-sm rounded-lg border border-gray-300 bg-white text-gray-900 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
            <option [ngValue]="null">اختر الفرع...</option>
            @for (b of branches; track b.id) { <option [ngValue]="b.id">{{ b.name }}</option> }
          </select>
        </div>
      }
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">الأولوية</label>
        <select [(ngModel)]="priority" class="w-full h-10 px-3 py-2 text-sm rounded-lg border border-gray-300 bg-white text-gray-900 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
          <option value="low">منخفضة</option>
          <option value="normal">عادية</option>
          <option value="high">مرتفعة</option>
          <option value="urgent">عاجلة</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-medium text-gray-600 mb-1">تاريخ الطلب</label>
        <app-date-picker id="sr-create-date" [value]="requestedDate" (valueChange)="requestedDate = $event"></app-date-picker>
      </div>
    </div>

    <div>
      <label class="block text-xs font-medium text-gray-600 mb-1">ملاحظات</label>
      <textarea [(ngModel)]="notes" rows="2" class="w-full px-3 py-2 text-sm rounded-lg border border-gray-300 bg-white text-gray-900 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20"></textarea>
    </div>

    <div>
      <div class="flex items-center justify-between mb-2">
        <label class="text-sm font-semibold text-gray-700">الأصناف المطلوبة</label>
        <button type="button" (click)="addItemRow()" class="text-xs font-medium text-brand-600 hover:text-brand-700 transition-colors">+ إضافة صنف</button>
      </div>

      <div class="space-y-2">
        @for (item of items; track $index) {
          <div class="grid grid-cols-12 gap-2 items-center">
            <select [(ngModel)]="item.product_id"
              class="col-span-8 h-9 px-2 py-1.5 text-sm rounded-lg border border-gray-300 bg-white text-gray-900 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
              <option [ngValue]="null">اختر المنتج</option>
              @for (p of transferableProducts; track p.id) { <option [ngValue]="p.id">{{ p.name }} ({{ p.sku }})</option> }
            </select>
            <input type="number" min="0" step="0.001" [(ngModel)]="item.requested_quantity" placeholder="الكمية"
              class="col-span-3 h-9 px-2 py-1.5 text-sm rounded-lg border border-gray-300 bg-white text-gray-900 focus:border-brand-400 focus:outline-none focus:ring-2 focus:ring-brand-500/20"/>
            <button type="button" (click)="removeItemRow($index)" class="col-span-1 text-error-500 hover:text-error-700 text-sm transition-colors">✕</button>
          </div>
        }
      </div>
    </div>

    <div class="flex items-center gap-2 pt-2">
      <button type="button" (click)="save()" [disabled]="saving"
        class="px-4 py-2 rounded-xl text-sm font-semibold bg-brand-500 hover:bg-brand-600 text-white transition-colors disabled:opacity-50">
        إرسال طلب المخزون
      </button>
    </div>

  </div>
</div>
